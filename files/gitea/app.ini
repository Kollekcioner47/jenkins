; Конфигурация Gitea — своего Git-сервера лаборатории (практика 6).
;
; Куда класть: /etc/gitea/app.ini, владелец git, права 0640.
; Читает её служба gitea (файл files/gitea/gitea.service).
;
; ЗАЧЕМ СВОЙ GIT-СЕРВЕР, ЕСЛИ ЕСТЬ GITHUB
;
; У стенда нет белого IP и нет сертификата. Значит, GitHub не может
; обратиться к нашему Jenkins: вебхук из облака в закрытую лабораторию
; не придёт. Внутри сети всё наоборот: Gitea на 10.0.2.5:3000 отдаёт
; репозитории по http, а по ssh — на порту 2222, и вебхук от неё
; до Jenkins доходит за миллисекунды. Поэтому весь контур — Git,
; Jenkins и вебхуки — живёт внутри одной подсети.

APP_NAME = Лаборатория CI/CD
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

[server]
; Внутренний адрес и внешний адрес различаются: слушать нужно на всех
; интерфейсах, а в ссылках показывать адрес, доступный с других машин.
; Если указать здесь localhost, Gitea будет отдавать ссылки на localhost,
; и они не откроются с node1 и node2 — классическая ошибка настройки.
PROTOCOL         = http
DOMAIN           = 10.0.2.5
HTTP_ADDR        = 0.0.0.0
HTTP_PORT        = 3000
ROOT_URL         = http://10.0.2.5:3000/

; SSH-доступ к репозиториям. Порт 2222, а не 22: на 22 уже слушает sshd
; самой машины, и занять его Gitea не может. Поэтому в адресах
; репозиториев порт указывается явно:
;     ssh://git@10.0.2.5:2222/engineer/site.git
SSH_DOMAIN       = 10.0.2.5
START_SSH_SERVER = true
SSH_PORT         = 2222
SSH_LISTEN_PORT  = 2222

; Хранилище больших файлов: пригодится, когда в репозиторий попадёт
; что-то тяжелее текста.
LFS_START_SERVER = true
LFS_JWT_SECRET   = заполните_своим_значением

; Журнал доступа роутера выключен: в лаборатории он только мешает.
DISABLE_ROUTER_LOG = true

[database]
; SQLite — осознанный выбор для стенда: одна машина, один файл,
; резервная копия сводится к копированию файла базы.
; Для команды из десятков человек это уже не подходит.
DB_TYPE = sqlite3
PATH    = /var/lib/gitea/data/gitea.db

[repository]
ROOT = /var/lib/gitea/repositories
; main, а не master — договорённость, которую стоит держать одинаковой
; на Git-сервере и в заданиях Jenkins. В прежней версии курса именно
; на этом расхождении терялось время: Jenkins искал ветку master,
; а репозиторий жил в main.
DEFAULT_BRANCH = main

[security]
; INSTALL_LOCK = true означает «мастер первичной установки пройден»:
; без него Gitea при первом открытии предложит настроить себя через
; браузер, и любой, кто откроет портал первым, станет администратором.
INSTALL_LOCK   = true
; Значения ниже сгенерируйте и подставьте свои:
;     openssl rand -hex 32
SECRET_KEY     = заполните_своим_значением
INTERNAL_TOKEN = заполните_своим_значением
; Пароль администратора из мастер-установки. После первой установки
; строку можно удалить.
; INSTALL_LOCK выше означает, что мастер не появится, поэтому
; администратора создаём командой (см. практику 6).

[service]
; Самостоятельная регистрация закрыта: пользователей заводит администратор.
DISABLE_REGISTRATION = true
; Открывать содержимое только после входа: репозиторий в лаборатории
; не должен быть доступен анонимно.
REQUIRE_SIGNIN_VIEW  = true

[lfs]
PATH = /var/lib/gitea/data/lfs

[log]
MODE  = console
LEVEL = Info

[mailer]
; Почта в лаборатории не настроена и не нужна: уведомления смотрим
; в портале Jenkins.
ENABLED = false
