# Локальный реестр образов лаборатории — практика 12.
#
# Запуск на контроллере (admin, 10.0.2.5):
#     docker compose -f files/docker/registry-compose.yml up -d
# Проверка:
#     curl http://10.0.2.5:5000/v2/_catalog
#
# ЗАЧЕМ СВОЙ РЕЕСТР, А НЕ DOCKER HUB
#
#   1. Hub требует учётной записи, а учебная учётная запись — это лишняя
#      сущность, которую надо заводить, защищать и однажды потерять.
#   2. Всё остаётся внутри подсети: образы не уезжают наружу.
#   3. Реестр работает без интернета — если внешний канал пропадёт,
#      конвейер продолжит работать.
#
# ВАЖНО ПРО HTTP. Реестр здесь работает по http, без сертификата.
# Docker по умолчанию такие реестры отвергает, поэтому на каждой машине,
# которая работает с образами, нужно разрешить его явно — см.
# files/docker/daemon.json. Это ровно то ограничение, из-за которого
# в рабочей среде реестр ставят за HTTPS.

services:
  registry:
    image: registry:2.8
    container_name: lab-registry
    restart: unless-stopped
    ports:
      # Слушаем на всех интерфейсах: образы нужны и с node1, и с node2.
      # Если оставить 127.0.0.1:5000, реестр будет доступен только
      # на самой машине, и это выяснится на этапе push.
      - "0.0.0.0:5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Учётная запись для push. Пароль берётся из файла, а не из
      # командной строки: аргументы видны в списке процессов.
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "lab-registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      - ./htpasswd:/auth/htpasswd:ro

volumes:
  registry-data:
    # Именованный том, а не каталог рядом с файлом: образы переживут
    # пересоздание контейнера и не окажутся внутри кэша сборки.
